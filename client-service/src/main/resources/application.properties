server.port=8081
spring.application.name=client-service

# Circuit Breaker configuration for storage-service
resilience4j.circuitbreaker.instances.storageService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.storageService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.storageService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.storageService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.storageService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.storageService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.storageService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.storageService.ignoreExceptions[0]=feign.FeignException$NotFound